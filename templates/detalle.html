{% extends 'base.html' %}{% block content %}<section class="section detail"><div class="detail-art">{% if p.get("imagen_id") %}<img src="{{url_for('imagen_producto',id=p.imagen_id)}}" alt="{{p.nombre}}">{% else %}<span class="sin-imagen">Sin imagen</span>{% endif %}</div><div><span class="eyebrow">{{p.categoria}}</span><h1>{{p.nombre}}</h1><p>{{p.descripcion}}</p><h2>{{p.precio|money}} MXN</h2><p>Existencias: {{p.stock}}</p><form method="post" action="{{url_for('agregar_carrito',id=p._id)}}"><input type="hidden" name="csrf" value="{{csrf}}"><label>Cantidad <input type="number" name="cantidad" value="1" min="1" max="20"></label><button class="btn" {% if p.stock==0 %}disabled{% endif %}>Añadir al carrito</button></form><a href="{{url_for('inicio')}}">← Volver a la tienda</a></div></section>{% endblock %}
