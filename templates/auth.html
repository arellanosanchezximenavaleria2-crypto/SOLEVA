{% extends 'base.html' %}{% block content %}<section class="auth panel"><span class="eyebrow">BIENVENIDA A AURA</span><h1>{{'Crear cuenta' if modo=='registro' else 'Iniciar sesión'}}</h1><form method="post"><input type="hidden" name="csrf" value="{{csrf}}">{% if modo=='registro' %}<label>Nombre<input name="nombre" maxlength="80" required></label>{% endif %}<label>Correo electrónico<input type="email" name="correo" required></label><label>Contraseña<input type="password" name="clave" minlength="8" required></label><button class="btn full">{{'Registrarme' if modo=='registro' else 'Entrar'}}</button></form><p>{% if modo=='registro' %}¿Ya tienes cuenta? <a href="{{url_for('login')}}">Inicia sesión</a>{% else %}¿Aún no tienes cuenta? <a href="{{url_for('registro')}}">Regístrate</a>{% endif %}</p></section>{% endblock %}
