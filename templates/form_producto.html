{% extends 'base.html' %}
{% block content %}
<section class="auth panel"><span class="eyebrow">ADMINISTRACIÓN</span>
<h1>{{ 'Editar' if p else 'Nuevo' }} producto</h1>
<form method="post" enctype="multipart/form-data">
<input type="hidden" name="csrf" value="{{csrf}}">
<label>Nombre<input name="nombre" maxlength="100" value="{{p.nombre if p else ''}}" required></label>
<label>Categoría<select name="categoria">{% for c in categorias %}<option value="{{c}}" {% if p and p.categoria==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label>
<label>Precio MXN<input name="precio" type="number" min="0.01" step="0.01" value="{{p.precio if p else ''}}" required></label>
<label>Stock<input name="stock" type="number" min="0" value="{{p.stock if p else 10}}" required></label>
<label>Imagen del producto (JPG, PNG o WEBP, máximo 4 MB)
<input name="imagen" type="file" accept="image/jpeg,image/png,image/webp"></label>
{% if p and p.get('imagen_id') %}<img class="imagen-preview" src="{{url_for('imagen_producto',id=p.imagen_id)}}" alt="Imagen actual de {{p.nombre}}"><p>Si no eliges otra imagen, se conserva la actual.</p>{% endif %}
<label>Descripción<textarea name="descripcion" maxlength="500" rows="4">{{p.descripcion if p else ''}}</textarea></label>
<button class="btn full">Guardar</button></form></section>
{% endblock %}
