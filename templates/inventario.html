{% extends 'base.html' %}{% block content %}<section class="section"><div class="split"><div><span class="eyebrow">ADMINISTRACIÓN</span><h1>Inventario de productos</h1></div><a class="btn" href="{{url_for('nuevo')}}">+ Nuevo producto</a></div><div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead><tbody>{% for p in productos %}<tr><td>{% if p.get("imagen_id") %}<img class="miniatura" src="{{url_for('imagen_producto',id=p.imagen_id)}}" alt="">{% endif %} {{p.nombre}}</td><td>{{p.categoria}}</td><td>{{p.precio|money}}</td><td>{{p.stock}}</td><td><a class="outline" href="{{url_for('editar',id=p._id)}}">Editar</a><form class="inline" method="post" action="{{url_for('eliminar',id=p._id)}}" onsubmit="return confirm('¿Desactivar producto?')"><input type="hidden" name="csrf" value="{{csrf}}"><button class="outline">Eliminar</button></form></td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
