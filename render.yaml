services:
  - type: web
    name: aura-skincare
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 90
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: aura_skincare
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
